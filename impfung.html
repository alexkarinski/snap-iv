<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Einverständnis Impfung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,600&display=swap">
<style>
/* Layout: same clinic-sheet look as the UKE questionnaires; the PDF is the original form with the answers written onto it. */
:root {
  --bg: #f4f6f8;
  --paper: #ffffff;
  --fg: #16212b;
  --muted: #5b6b79;
  --line: #d5dde4;
  --accent: #0b5e7e;
  --accent-fg: #ffffff;
  --font-display: "Literata", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1419; --paper: #162029; --fg: #e6edf2; --muted: #93a4b2;
    --line: #2a3945; --accent: #5ab8de; --accent-fg: #06222e;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 20px; min-width: 0; }
.org { font-size: 12px; color: var(--muted); }
.org strong { color: var(--fg); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: 22px; line-height: 1.25; margin: 10px 0 6px; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 18px; line-height: 1.3; margin: 0 0 8px; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 12px; }
.fields { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 16px; }
@media (min-width: 560px) { .fields { grid-template-columns: 2fr 1fr; } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
input[type="text"], input[type="date"] {
  font: inherit; font-size: 15px; color: var(--fg); background: transparent;
  border: 0; border-bottom: 1px solid var(--muted); padding: 6px 0; border-radius: 0; min-width: 0; width: 100%;
}
input[type="text"]:focus, input[type="date"]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.lang { display: inline-flex; margin-top: 14px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.langbtn { font: inherit; font-size: 13px; padding: 8px 16px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.langbtn + .langbtn { border-left: 1px solid var(--line); }
.langbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.q { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.q:first-of-type { border-top: 0; }
.qtext { display: flex; gap: 10px; min-width: 0; }
.qn { font-family: var(--font-mono); font-size: 13px; color: var(--muted); min-width: 24px; padding-top: 2px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 260px; margin-left: 34px; }
.opt { position: relative; min-width: 0; display: block; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
.opt input:hover + span { border-color: var(--accent); }
.opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.sub { margin-left: 34px; display: flex; flex-direction: column; gap: 10px; }
.chk { display: grid; grid-template-columns: 1fr; gap: 6px; align-items: end; }
@media (min-width: 560px) { .chk { grid-template-columns: 1fr 170px; } }
.chk > label:first-child { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; }
input[type="checkbox"] { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.subhead { font-size: 12px; color: var(--muted); }
.consent p + p { margin-top: 6px; }
.sigwrap { margin-top: 14px; }
canvas#sig { display: block; width: 100%; max-width: 420px; aspect-ratio: 3 / 1; background: #fff; border: 1px dashed var(--muted); border-radius: 6px; touch-action: none; margin-top: 4px; }
textarea {
  width: 100%; margin-top: 4px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; resize: vertical;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
button.btn { font: inherit; font-size: 14px; padding: 10px 14px; border-radius: 6px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
button.btn.ghost { background: transparent; color: var(--accent); }
button.btn:disabled { opacity: .6; cursor: default; }
button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="sheet">
    <div class="org"><strong>Ambulanzzentrum des UKE GmbH</strong> · Fachbereich Arbeitsmedizin</div>
    <h1 data-t="title"></h1>
    <p class="muted" data-t="intro"></p>
    <div class="lang" role="group" aria-label="Sprache / Язык">
      <button type="button" class="langbtn" data-l="de">Deutsch</button>
      <button type="button" class="langbtn" data-l="ru">Русский</button>
    </div>
    <div class="fields">
      <label class="f"><span data-t="name"></span><input type="text" data-k="name" autocomplete="name"></label>
      <label class="f"><span data-t="dob"></span><input type="date" data-k="dob"></label>
    </div>
  </div>

  <div class="sheet">
    <h2 data-t="hist"></h2>
    <div id="qs"></div>
  </div>

  <div class="sheet consent">
    <h2 data-t="consentH"></h2>
    <p data-t="c1"></p>
    <p data-t="c2"></p>
    <p data-t="c3"></p>
    <div class="q" style="border-top:0;padding-bottom:0">
      <div class="qtext"><span class="qn"></span><span data-t="cq"></span></div>
      <div class="opts" style="max-width:360px" role="radiogroup">
        <label class="opt"><input type="radio" name="consent" value="ja"><span data-t="cyes"></span></label>
        <label class="opt"><input type="radio" name="consent" value="nein"><span data-t="cno"></span></label>
      </div>
    </div>
    <div class="fields">
      <label class="f"><span data-t="place"></span><input type="date" data-k="date"></label>
    </div>
    <div class="sigwrap">
      <label class="f" for="sig"><span data-t="sig"></span></label>
      <canvas id="sig" width="900" height="300"></canvas>
      <div class="actions" style="margin-top:6px"><button type="button" class="btn ghost" id="sigclear" data-t="sigclear"></button></div>
    </div>
    <p class="note" data-t="doctor"></p>
  </div>

  <div class="sheet">
    <h2 data-t="resH"></h2>
    <div class="actions">
      <button type="button" class="btn" id="send" data-t="send"></button>
      <button type="button" class="btn ghost" id="pdf" data-t="pdf"></button>
      <button type="button" class="btn ghost" id="copy" data-t="copy"></button>
      <button type="button" class="btn ghost" id="reset" data-t="reset"></button>
    </div>
    <p class="note" id="status"></p>
    <label class="f" for="out" style="margin-top:14px"><span data-t="outL"></span></label>
    <textarea id="out" readonly rows="10"></textarea>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script>
/* Same FormSubmit inbox and ntfy topic as the SNAP-IV and UKE forms; ntfy also gets the filled PDF as an attachment. */
var MAIL_ENDPOINT = "https://formsubmit.co/ajax/alex.karinski@gmail.com";
var PUSH_ENDPOINT = "https://ntfy.sh/snapiv-5046b0fcd218ecc31c";
var PDF_NAME = "Einverstaendnis-Impfung.pdf";

var T = {
  title: ["Einverständniserklärung zur Impfung", "Согласие на вакцинацию"],
  intro: ["Antworten und Unterschrift werden in diesem Browser automatisch gespeichert. Das PDF ist der Originalbogen mit Ihren Angaben. „Speichern“ sendet alles per E-Mail und ntfy (mit PDF).",
          "Ответы и подпись сохраняются в этом браузере автоматически. PDF — это оригинальный бланк с вписанными ответами. «Сохранить» отправляет всё на почту и в ntfy (с PDF). Текстовые поля лучше заполнять по-немецки: они попадают в бланк как есть."],

  yes: ["ja", "да"], no: ["nein", "нет"],
  q1: ["Wurden Sie in den letzten 4 Wochen geimpft?", "Делали ли вам прививки за последние 4 недели?"],

  hepa: ["Hepatitis A, Immunglobuline", "Гепатит A, иммуноглобулины"],

  otherName: ["welche?", "какие?"],
  date: ["Datum", "Дата"],
  q2: ["Sind bei vorangegangen Impfungen unerwünschte Reaktionen aufgetreten?", "Были ли нежелательные реакции на предыдущие прививки?"],

  q4: ["Leiden Sie an chronischen Erkrankungen wie Leukämie, Krebs, AIDS, Diabetes, chron. Hepatitis, Nerven-, Nierenleiden, TBC, Asthma?",
       "Есть ли у вас хронические заболевания: лейкоз, рак, СПИД, диабет, хронический гепатит, болезни нервной системы или почек, туберкулёз, астма?"],
  q5: ["Besteht derzeit eine Schwangerschaft?", "Есть ли сейчас беременность?"],
  q6: ["Bestehen Allergien, insbesondere auf Formaldehyd, Hühnereiweiß, Thiomersal, Neomycin, Natriumsalze, Kaliumsalze, Octoxinol?",
       "Есть ли аллергии, особенно на формальдегид, куриный белок, тиомерсал, неомицин, соли натрия, соли калия, октоксинол?"],
  q7: ["Nehmen Sie regelmäßig Medikamente ein?", "Принимаете ли вы регулярно лекарства?"],

  detail: ["Details (optional)", "Подробнее, свой ответ (необязательно)"],
  pNo: ["nein/ausgeschlossen", "нет / исключено"],
  pPlan: ["geplant innerhalb der nächsten … Wo./Mt.", "планируется в ближайшие … нед./мес."],
  pPlanF: ["Wo./Mt.", "нед./мес."],
  pNotEx: ["nicht ausgeschlossen", "не исключено"],
  pWeek: ["Schwangerschaft in der … Woche", "беременность, … неделя"],
  pWeekF: ["Woche", "неделя"],
  pStill: ["Stillzeit", "Грудное вскармливание"],
  pFrom: ["seit", "с"], pTo: ["bis voraussichtlich", "предположительно до"],
  consentH: ["Einwilligungserklärung", "Согласие"],
  c1: ["Ich wurde über die Bedeutung der geplanten Schutzimpfung sowie deren Nutzen und Risiken informiert und habe diesen Aufklärungsbogen gelesen und verstanden.",
       "Меня проинформировали о значении планируемой прививки, её пользе и рисках; я прочитал(а) и понял(а) этот информационный лист."],
  c2: ["Es bestand ausreichend Gelegenheit, mit dem zuständigen Arzt /Ärztin offene Fragen zu besprechen.",
       "У меня была достаточная возможность обсудить открытые вопросы с лечащим врачом."],
  c3: ["Meine Fragen sind lückenlos beantwortet worden und ich habe eine Kopie dieser Einwilligungserklärung erhalten.",
       "На все мои вопросы получены полные ответы, и я получил(а) копию этого согласия."],
  cq: ["Mit der Durchführung der Impfung bin ich", "С проведением прививки я"],
  cyes: ["einverstanden", "согласен(на)"], cno: ["nicht einverstanden", "не согласен(на)"],
  place: ["Hamburg, den (Datum)", "Гамбург, дата"],
  sig: ["Unterschrift (mit Finger oder Maus)", "Подпись (пальцем или мышью)"],
  sigclear: ["Unterschrift löschen", "Стереть подпись"],
  doctor: ["Der Block „Verabreichte Impfung“ wird von Arzt/Ärztin ausgefüllt und bleibt leer.",
           "Блок «Verabreichte Impfung» внизу бланка заполняет врач, он остаётся пустым."],
  resH: ["Speichern", "Сохранение"],
  send: ["Speichern (E-Mail + ntfy)", "Сохранить (почта + ntfy)"],
  pdf: ["PDF herunterladen", "Скачать PDF"],
  copy: ["Text kopieren", "Скопировать текст"],
  reset: ["Alles löschen", "Очистить всё"],
  outL: ["Text (Deutsch)", "Текст для врача (на немецком)"]
};

var KEY = "impfung-v1";
function blank() {
  return {
    lang: "ru", name: "", dob: "", date: new Date().toISOString().slice(0, 10), consent: "",
    q: {}, d: {}, vac: { polio: {}, hepa: {}, mmr: {}, other: {} },
    preg: { no: false, plan: false, planN: "", notex: false, week: false, weekN: "", still: false, from: "", to: "" },
    meds: "", sig: ""
  };
}
var S = blank();
try {
  var s0 = JSON.parse(localStorage.getItem(KEY) || "null");
  if (s0) { for (var k in s0) S[k] = s0[k]; }
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} update(); }
function tr(k) { return T[k][S.lang === "de" ? 0 : 1]; }

function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  for (var k in attrs || {}) {
    if (k === "class") e.className = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { e.appendChild(c); });
  return e;
}
/* Inputs carry their state path in data-k ("vac.polio.date"); one listener keeps S in sync. */
function getK(path) { return path.split(".").reduce(function (o, p) { return o == null ? o : o[p]; }, S); }
function setK(path, v) { var ps = path.split("."), o = S; for (var i = 0; i < ps.length - 1; i++) { o[ps[i]] = o[ps[i]] || {}; o = o[ps[i]]; } o[ps[ps.length - 1]] = v; }
function text(k) { return h("input", { type: "text", "data-k": k }); }
function field(labelKey, input) { return h("label", { class: "f" }, [h("span", { "data-t": labelKey }), input]); }
function check(k, labelKey) { return h("label", {}, [h("input", { type: "checkbox", "data-k": k }), h("span", { "data-t": labelKey })]); }

/* ---------- questions ---------- */
var qs = document.getElementById("qs");
function yn(n) {
  var q = h("div", { class: "q", role: "radiogroup" }, [
    h("div", { class: "qtext" }, [h("span", { class: "qn", text: n + "." }), h("span", { "data-t": "q" + n })]),
    h("div", { class: "opts" }, ["ja", "nein"].map(function (v) {
      return h("label", { class: "opt" }, [h("input", { type: "radio", name: "q" + n, "data-k": "q." + n, value: v }), h("span", { "data-t": v === "ja" ? "yes" : "no" })]);
    }))
  ]);
  qs.appendChild(q);
  var sub = h("div", { class: "sub" });
  q.appendChild(sub);
  return sub;
}
var s1 = yn(1);
s1.appendChild(h("span", { class: "subhead", "data-t": "q1sub" }));
["polio", "hepa", "mmr", "other"].forEach(function (v) {
  var row = h("div", { class: "chk" }, [check("vac." + v + ".on", v), field("date", h("input", { type: "date", "data-k": "vac." + v + ".date" }))]);
  s1.appendChild(row);
  if (v === "other") s1.appendChild(field("otherName", text("vac.other.name")));
});
[2, 3, 4].forEach(function (n) { yn(n).appendChild(field("detail", text("d." + n))); });
var s5 = yn(5);
s5.appendChild(h("div", { class: "chk" }, [check("preg.no", "pNo")]));
s5.appendChild(h("div", { class: "chk" }, [check("preg.plan", "pPlan"), field("pPlanF", text("preg.planN"))]));
s5.appendChild(h("div", { class: "chk" }, [check("preg.notex", "pNotEx")]));
s5.appendChild(h("div", { class: "chk" }, [check("preg.week", "pWeek"), field("pWeekF", text("preg.weekN"))]));
s5.appendChild(h("div", { class: "chk" }, [check("preg.still", "pStill")]));
s5.appendChild(h("div", { class: "fields", style: "margin-top:0" }, [field("pFrom", text("preg.from")), field("pTo", text("preg.to"))]));
yn(6).appendChild(field("detail", text("d.6")));
yn(7).appendChild(field("q7sub", text("meds")));

/* ---------- bind inputs ---------- */
var inputs = document.querySelectorAll("[data-k]");
function fillInputs() {
  inputs.forEach(function (el) {
    var v = getK(el.getAttribute("data-k"));
    if (el.type === "checkbox") el.checked = !!v;
    else if (el.type === "radio") el.checked = v === el.value;
    else el.value = v || "";
  });
  document.querySelectorAll('input[name="consent"]').forEach(function (el) { el.checked = S.consent === el.value; });
}
document.addEventListener("input", function (e) {
  var el = e.target, k = el.getAttribute && el.getAttribute("data-k");
  if (el.name === "consent") { S.consent = el.value; save(); return; }
  if (!k) return;
  setK(k, el.type === "checkbox" ? el.checked : el.value);
  /* Filling a detail under a question implies the box next to it. */
  var m = /^vac\.(\w+)\.(date|name)$/.exec(k);
  if (m && el.value) { S.vac[m[1]].on = true; if (!S.q[1]) S.q[1] = "ja"; fillInputs(); }
  if (k === "meds" && el.value && !S.q[7]) { S.q[7] = "ja"; fillInputs(); }
  save();
});

function syncLang() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = tr(el.getAttribute("data-t")); });
  document.querySelectorAll(".langbtn").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === S.lang)); });
}
document.querySelector(".lang").addEventListener("click", function (e) {
  var b = e.target.closest(".langbtn"); if (!b) return;
  S.lang = b.getAttribute("data-l"); syncLang(); save();
});

/* ---------- signature ---------- */
var cv = document.getElementById("sig"), cx = cv.getContext("2d"), drawing = false;
cx.lineWidth = 4; cx.lineCap = "round"; cx.lineJoin = "round"; cx.strokeStyle = "#0a1f5c";
function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }
function loadSig() {
  cx.clearRect(0, 0, cv.width, cv.height);
  if (!S.sig) return;
  var img = new Image(); img.onload = function () { cx.drawImage(img, 0, 0); }; img.src = S.sig;
}
cv.addEventListener("pointerdown", function (e) { drawing = true; cv.setPointerCapture(e.pointerId); var p = pos(e); cx.beginPath(); cx.moveTo(p[0], p[1]); cx.lineTo(p[0] + .1, p[1]); cx.stroke(); });
cv.addEventListener("pointermove", function (e) { if (!drawing) return; var p = pos(e); cx.lineTo(p[0], p[1]); cx.stroke(); });
function endSig() { if (!drawing) return; drawing = false; S.sig = cv.toDataURL("image/png"); save(); }
cv.addEventListener("pointerup", endSig); cv.addEventListener("pointercancel", endSig);
document.getElementById("sigclear").addEventListener("click", function () { S.sig = ""; loadSig(); save(); });

/* ---------- German text ---------- */
function deDate(iso) { if (!iso) return ""; var p = iso.split("-"); return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : iso; }
function de(k) { return T[k][0]; }
function jn(v) { return v ? v : "—"; }
function buildText() {
  var L = ["Einverständniserklärung zur Impfung", "Ambulanzzentrum des UKE GmbH, Fachbereich Arbeitsmedizin", "",
    "Name, Vorname: " + jn(S.name), "Geb.: " + jn(deDate(S.dob)), "", "Vorgeschichte"];
  L.push("1. " + de("q1") + " " + jn(S.q[1]));
  ["polio", "hepa", "mmr", "other"].forEach(function (v) {
    var x = S.vac[v] || {};
    if (x.on || x.date) L.push("   [x] " + de(v) + (v === "other" && x.name ? ": " + x.name : "") + (x.date ? ", Datum: " + deDate(x.date) : ""));
  });
  [2, 3, 4, 5, 6, 7].forEach(function (n) {
    L.push(n + ". " + de("q" + n) + " " + jn(S.q[n]));
    if (S.d[n]) L.push("   " + S.d[n]);
    if (n === 5) {
      var p = S.preg;
      if (p.no) L.push("   [x] nein/ausgeschlossen");
      if (p.plan) L.push("   [x] geplant innerhalb der nächsten " + (p.planN || "___") + " Wo./Mt.");
      if (p.notex) L.push("   [x] nicht ausgeschlossen");
      if (p.week) L.push("   [x] Schwangerschaft in der " + (p.weekN || "___") + " Woche");
      if (p.still) L.push("   [x] Stillzeit seit " + (p.from || "___") + " bis voraussichtlich " + (p.to || "___"));
    }
    if (n === 7 && S.meds) L.push("   Wenn ja, welche? " + S.meds);
  });
  L.push("", "Einwilligungserklärung: Mit der Durchführung der Impfung bin ich " +
    (S.consent === "ja" ? "einverstanden" : S.consent === "nein" ? "nicht einverstanden" : "—"));
  L.push("Hamburg, den " + jn(deDate(S.date)), "Unterschrift: " + (S.sig ? "vorhanden (im PDF)" : "—"));
  return L.join("\n");
}
var out = document.getElementById("out");
function update() { out.value = buildText(); }

/* ---------- PDF: answers written onto the original form (coordinates in points from the top-left, A4) ---------- */
var tplCache;
async function makePdf() {
  if (!window.PDFLib || !window.fontkit) throw new Error("PDF library not loaded");
  if (!tplCache) tplCache = await Promise.all([
    fetch("impfung-vorlage.pdf").then(function (r) { return r.arrayBuffer(); }),
    fetch("fonts/Carlito-Regular.ttf").then(function (r) { return r.arrayBuffer(); })
  ]);
  var doc = await PDFLib.PDFDocument.load(tplCache[0]);
  doc.registerFontkit(fontkit);
  var font = await doc.embedFont(tplCache[1], { features: { liga: false } });
  var ink = PDFLib.rgb(0.04, 0.12, 0.36);
  var pages = doc.getPages(), p1 = pages[0], p2 = pages[1];
  function fit(s, w, size) { while (size > 6 && font.widthOfTextAtSize(s, size) > w) size -= 0.5; return size; }
  function txt(p, s, x, base, maxW, size) {
    if (!s) return;
    s = String(s); size = fit(s, maxW || 400, size || 10);
    p.drawText(s, { x: x, y: p.getHeight() - base, size: size, font: font, color: ink });
  }
  /* x/yMax: the ☐ glyph's box as pdftotext reports it; the drawn square spans x+0.5…x+7.25 and yMax-9.5…yMax-2.75. */
  function tick(p, x, yMax) {
    var H = p.getHeight(), x0 = x + 1.6, x1 = x + 6.2, y0 = H - (yMax - 3.9), y1 = H - (yMax - 8.4);
    p.drawLine({ start: { x: x0, y: y0 }, end: { x: x1, y: y1 }, thickness: 1.2, color: ink });
    p.drawLine({ start: { x: x0, y: y1 }, end: { x: x1, y: y0 }, thickness: 1.2, color: ink });
  }
  var YN = { 1: 242, 2: 408, 3: 462, 4: 492, 5: 545, 6: 665, 7: 733 };
  for (var n in YN) { if (S.q[n] === "ja") tick(p1, 349, YN[n]); else if (S.q[n] === "nein") tick(p1, 420, YN[n]); }
  txt(p1, S.name, 137, 179, 185);
  txt(p1, deDate(S.dob), 352, 179, 150);
  [["polio", 280], ["hepa", 310], ["mmr", 339], ["other", 369]].forEach(function (r) {
    var v = S.vac[r[0]] || {};
    if (v.on) tick(p1, 101, r[1]);
    txt(p1, deDate(v.date), 392, r[1] - 2, 76);
  });
  txt(p1, S.vac.other && S.vac.other.name, 198, 367, 116);
  /* Free-text details go in the gap under each question. */
  txt(p1, S.d[2], 101, 436, 340, 9);
  txt(p1, S.d[3], 101, 473, 340, 9);
  txt(p1, S.d[4], 218, 519, 240, 9);
  txt(p1, S.d[6], 101, 707, 340, 9);
  var pg = S.preg;
  if (pg.no) tick(p1, 101, 575);
  if (pg.plan) tick(p1, 252, 575);
  txt(p1, pg.planN, 405, 573, 24, 9);
  if (pg.notex) tick(p1, 101, 600);
  if (pg.week) tick(p1, 252, 600);
  txt(p1, pg.weekN, 372, 598, 24, 9);
  if (pg.still) tick(p1, 101, 626);
  txt(p1, pg.from, 183, 624, 32, 8);
  txt(p1, pg.to, 297, 624, 46, 8);
  /* Medications: first line after "welche?", the rest on the line below. */
  if (S.meds) {
    var words = S.meds.split(/\s+/), l1 = "", i = 0;
    while (i < words.length && font.widthOfTextAtSize((l1 ? l1 + " " : "") + words[i], 10) <= 277) { l1 += (l1 ? " " : "") + words[i]; i++; }
    if (!l1) { l1 = words[0]; i = 1; }
    txt(p1, l1, 181, 745, 277);
    txt(p1, words.slice(i).join(" "), 103, 769, 357);
  }
  if (S.consent === "ja") tick(p2, 242, 183); else if (S.consent === "nein") tick(p2, 313, 183);
  txt(p2, deDate(S.date), 125, 232, 120);
  if (S.sig) {
    var img = await doc.embedPng(S.sig);
    p2.drawImage(img, { x: 318, y: p2.getHeight() - 234, width: 150, height: 50 });
  }
  return new Blob([await doc.save()], { type: "application/pdf" });
}

var statusEl = document.getElementById("status");
document.getElementById("pdf").addEventListener("click", async function () {
  try {
    var blob = await makePdf();
    var a = h("a", { href: URL.createObjectURL(blob), download: PDF_NAME });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
    statusEl.textContent = S.lang === "de" ? "PDF heruntergeladen." : "PDF скачан.";
  } catch (e) { statusEl.textContent = (S.lang === "de" ? "PDF konnte nicht erstellt werden: " : "Не удалось собрать PDF: ") + e.message; }
});

async function sendMail() {
  var res = await fetch(MAIL_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      _subject: "✅ Einverständnis Impfung" + (S.name ? " (" + S.name + ")" : ""),
      _template: "box",
      _captcha: "false",
      "Bericht (Deutsch)": buildText()
    })
  });
  var data = await res.json().catch(function () { return {}; });
  if (!res.ok || String(data.success) === "false") throw new Error(data.message || "send failed");
}
/* ntfy: the PDF as an attachment; plain text push if the PDF can't be built or uploaded. */
async function push() {
  var title = "Einverständnis Impfung" + (S.name ? " (" + S.name + ")" : "");
  var msg = "Einverständnis: " + (S.consent === "ja" ? "einverstanden" : S.consent === "nein" ? "nicht einverstanden" : "—");
  try {
    var blob = await makePdf();
    var r = await fetch(PUSH_ENDPOINT + "?title=" + encodeURIComponent(title) + "&message=" + encodeURIComponent(msg) + "&filename=" + PDF_NAME + "&tags=syringe", { method: "PUT", body: blob });
    if (r.ok) return true;
  } catch (e) {}
  return fetch(PUSH_ENDPOINT + "?title=" + encodeURIComponent(title) + "&tags=syringe", { method: "POST", body: buildText() })
    .then(function (r) { return r.ok; }, function () { return false; });
}
var bSend = document.getElementById("send");
bSend.addEventListener("click", async function () {
  var ru = S.lang !== "de";
  bSend.disabled = true; bSend.textContent = ru ? "Сохраняю…" : "Speichere…";
  var pushed = push().catch(function () { return false; });
  var mailed = sendMail().then(function () { return true; }, function (e) { return e; });
  var okPush = await pushed, okMail = await mailed;
  bSend.disabled = false; bSend.textContent = tr("send");
  var act = /activat/i.test(okMail && okMail.message || "");
  if (okMail === true) statusEl.textContent = ru ? "Отправлено на почту" + (okPush ? " и в ntfy (с PDF)." : ", а ntfy не прошёл.") : "Per E-Mail gesendet" + (okPush ? " und an ntfy (mit PDF)." : ", ntfy fehlgeschlagen.");
  else if (okPush) statusEl.textContent = ru ? "В ntfy ушло, письмо нет" + (act ? " (FormSubmit ждёт активации)." : ".") : "An ntfy gesendet, E-Mail nicht" + (act ? " (FormSubmit wartet auf Aktivierung)." : ".");
  else statusEl.textContent = ru ? "Не удалось отправить. Скачайте PDF или скопируйте текст." : "Senden fehlgeschlagen. PDF herunterladen oder Text kopieren.";
});

document.getElementById("copy").addEventListener("click", function () {
  var btn = this, label = tr("copy");
  function done(m) { btn.textContent = m; setTimeout(function () { btn.textContent = label; }, 1800); }
  try { navigator.clipboard.writeText(out.value).then(function () { done("✓"); }, function () { out.select(); }); }
  catch (e) { out.select(); }
});
var resetArmed = false;
document.getElementById("reset").addEventListener("click", function () {
  if (!resetArmed) { resetArmed = true; this.textContent = S.lang === "de" ? "Wirklich löschen?" : "Точно очистить?"; return; }
  resetArmed = false;
  var lang = S.lang; S = blank(); S.lang = lang;
  fillInputs(); loadSig(); syncLang(); save();
});

fillInputs(); loadSig(); syncLang(); update();
